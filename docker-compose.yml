services:
  postgres:
    image: postgres:16-alpine
    container_name: hvac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hvac-network

  thingsboard:
    image: thingsboard/tb-postgres:latest
    container_name: hvac-thingsboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TB_QUEUE_TYPE: in-memory
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thingsboard
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DATABASE_TS_TYPE: sql
      MQTT_ENABLED: "true"
      MQTT_BIND_ADDRESS: "0.0.0.0"
      MQTT_BIND_PORT: "1883"
    volumes:
      - thingsboard_data:/data
      - thingsboard_logs:/var/log/thingsboard
    ports:
      - "8080:9090"
      - "1883:1883"
    networks:
      - hvac-network

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    image: hvac-dt-backend:latest
    container_name: hvac-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      thingsboard:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: hvac
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      THINGSBOARD_URL: http://thingsboard:9090
      THINGSBOARD_ADMIN_EMAIL: ${THINGSBOARD_ADMIN_EMAIL}
      THINGSBOARD_ADMIN_PASSWORD: ${THINGSBOARD_ADMIN_PASSWORD}
      DAIKIN_CLIENT_ID: ${DAIKIN_CLIENT_ID}
      DAIKIN_CLIENT_SECRET: ${DAIKIN_CLIENT_SECRET}
      DAIKIN_REDIRECT_URI: ${DAIKIN_REDIRECT_URI}
      D365_ORG_URI: ${D365_ORG_URI}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      FRONTEND_URL: http://192.168.20.231:3000
    volumes:
      - documents_storage:/app/documents
    ports:
      - "3001:3001"
    networks:
      - hvac-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://192.168.20.231:3001/api
    image: hvac-dt-frontend:latest
    container_name: hvac-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://192.168.20.231:3001/api
      NEXT_PUBLIC_APP_URL: http://192.168.20.231:3000
      AUTODESK_CLIENT_ID: ${AUTODESK_CLIENT_ID}
      AUTODESK_CLIENT_SECRET: ${AUTODESK_CLIENT_SECRET}
      BACKEND_URL: http://backend:3001
    ports:
      - "3000:3000"
    networks:
      - hvac-network

volumes:
  postgres_data:
  thingsboard_data:
  thingsboard_logs:
  documents_storage:

networks:
  hvac-network:
    name: hvac-network
    driver: bridge
