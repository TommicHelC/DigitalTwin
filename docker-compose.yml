services:
  postgres:
    image: postgres:16-alpine
    container_name: hvac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hvac-network

  thingsboard:
    image: thingsboard/tb-ce:latest
    container_name: hvac-thingsboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TB_QUEUE_TYPE: in-memory
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thingsboard
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DATABASE_TS_TYPE: sql
      MQTT_ENABLED: "true"
      MQTT_BIND_ADDRESS: "0.0.0.0"
      MQTT_BIND_PORT: "1883"
    volumes:
      - thingsboard_data:/data
      - thingsboard_logs:/var/log/thingsboard
    ports:
      - "8080:9090"
      - "1883:1883"
    networks:
      - hvac-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.thingsboard.rule=Host(`${TB_DOMAIN}`)"
      - "traefik.http.routers.thingsboard.entrypoints=websecure"
      - "traefik.http.routers.thingsboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.thingsboard.loadbalancer.server.port=9090"

  traefik:
    image: traefik:v3.3
    container_name: hvac-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=hvac-network"
      - "--providers.file.filename=/dynamic.yml"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme.json"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/dynamic.yml:/dynamic.yml:ro
      - ./infra/traefik/acme.json:/acme.json
    networks:
      - hvac-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_BASIC_AUTH}"

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    image: hvac-dt-backend:latest
    container_name: hvac-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      thingsboard:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: hvac
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      THINGSBOARD_URL: http://thingsboard:9090
      THINGSBOARD_ADMIN_EMAIL: ${THINGSBOARD_ADMIN_EMAIL}
      THINGSBOARD_ADMIN_PASSWORD: ${THINGSBOARD_ADMIN_PASSWORD}
      DAIKIN_CLIENT_ID: ${DAIKIN_CLIENT_ID}
      DAIKIN_CLIENT_SECRET: ${DAIKIN_CLIENT_SECRET}
      DAIKIN_REDIRECT_URI: ${DAIKIN_REDIRECT_URI}
      D365_ORG_URI: ${D365_ORG_URI}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      FRONTEND_URL: https://${APP_DOMAIN}
    volumes:
      - documents_storage:/app/documents
    networks:
      - hvac-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=3001"
      - "traefik.http.middlewares.backend-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.backend-ratelimit.ratelimit.burst=50"
      - "traefik.http.routers.backend.middlewares=backend-ratelimit"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: hvac-dt-frontend:latest
    container_name: hvac-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
      NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
      AUTODESK_CLIENT_ID: ${AUTODESK_CLIENT_ID}
      AUTODESK_CLIENT_SECRET: ${AUTODESK_CLIENT_SECRET}
      BACKEND_URL: http://backend:3001
    networks:
      - hvac-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

volumes:
  postgres_data:
  thingsboard_data:
  thingsboard_logs:
  documents_storage:

networks:
  hvac-network:
    name: hvac-network
    driver: bridge
